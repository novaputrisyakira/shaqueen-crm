    // Reusable Custom Product Dropdown with Photos for B2C & B2B forms
    function ProductDropdown({ products, value, onChange, priceType = 'b2c' }) {
      const [isOpen, setIsOpen] = useState(false);
      const [search, setSearch] = useState('');
      const dropdownRef = useRef(null);

      const selected = products.find(p => p.id === value) || products[0];

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const filtered = products.filter(p => {
        const q = search.toLowerCase();
        return p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
      });

      return (
        <div className="relative" ref={dropdownRef}>
          <button
            type="button"
            onClick={() => setIsOpen(!isOpen)}
            className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between gap-3 text-left focus:outline-none focus:ring-2 focus:ring-brand-500 hover:border-slate-300 transition-all"
          >
            {selected ? (
              <div className="flex items-center gap-2.5 min-w-0 flex-1">
                <div className="w-9 h-9 rounded-lg overflow-hidden bg-slate-100 border border-slate-200/80 shrink-0 flex items-center justify-center">
                  {(selected.image_url || selected.imageUrl) ? (
                    <img src={selected.image_url || selected.imageUrl} alt={selected.name} className="w-full h-full object-cover" onError={(e)=>{e.target.src='https://placehold.co/80x80/E85D04/FFFFFF?text=SF';}} />
                  ) : (
                    <span className="text-slate-400 text-xs">🍲</span>
                  )}
                </div>
                <div className="min-w-0 flex-1">
                  <span className="font-bold text-slate-900 text-xs block truncate">{selected.name}</span>
                  <div className="flex items-center gap-2 text-[11px] text-slate-500">
                    <span className={`font-bold ${priceType === 'b2c' ? 'text-brand-600' : 'text-sage-600'}`}>
                      {formatIDR(priceType === 'b2c' ? selected.b2cPrice : selected.b2bPrice)}
                    </span>
                    <span className="text-slate-300">•</span>
                    <span className="text-slate-400">Sisa: {selected.stock} pcs</span>
                    {priceType === 'b2b' && (
                      <>
                        <span className="text-slate-300">•</span>
                        <span className="text-sage-700 font-bold text-[10px] bg-sage-50 px-1.5 py-0.5 rounded border border-sage-200">
                          1 {selected.b2bUnit || 'Karton'} = {selected.b2bConversion || 12} Pcs
                        </span>
                      </>
                    )}
                  </div>
                </div>
              </div>
            ) : (
              <span className="text-slate-400 text-xs">-- Pilih Produk --</span>
            )}
            <svg className={`w-4 h-4 text-slate-400 transition-transform ${isOpen ? 'rotate-180 text-brand-500' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

          {isOpen && (
            <div className="absolute z-50 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-2xl shadow-2xl overflow-hidden animate-in fade-in">
              <div className="p-2 border-b border-slate-100 bg-slate-50/50">
                <input
                  type="text"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Cari nama cemilan atau SKU..."
                  className="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs text-slate-800 focus:outline-none focus:border-brand-500"
                  autoFocus
                />
              </div>
              <div className="max-h-56 overflow-y-auto divide-y divide-slate-100 text-xs">
                {filtered.length === 0 ? (
                  <div className="p-4 text-center text-slate-400">Tidak ada produk ditemukan</div>
                ) : filtered.map(p => {
                  const isCur = p.id === selected?.id;
                  const price = priceType === 'b2c' ? p.b2cPrice : p.b2bPrice;
                  return (
                    <div
                      key={p.id}
                      onClick={() => { onChange(p.id); setIsOpen(false); setSearch(''); }}
                      className={`p-2.5 flex items-center justify-between gap-3 cursor-pointer transition-colors ${
                        isCur ? 'bg-brand-50 text-brand-900 font-semibold' : 'hover:bg-slate-50 text-slate-700'
                      }`}
                    >
                      <div className="flex items-center gap-2.5 min-w-0 flex-1">
                        <div className="w-10 h-10 rounded-lg overflow-hidden bg-slate-100 border border-slate-200 shrink-0 flex items-center justify-center">
                          {(p.image_url || p.imageUrl) ? (
                            <img src={p.image_url || p.imageUrl} alt={p.name} className="w-full h-full object-cover" onError={(e)=>{e.target.src='https://placehold.co/80x80/E85D04/FFFFFF?text=SF';}} />
                          ) : (
                            <span className="text-slate-400 text-xs">🍲</span>
                          )}
                        </div>
                        <div className="min-w-0 flex-1">
                          <span className="font-bold text-slate-900 text-xs block truncate">{p.name}</span>
                          <div className="flex items-center gap-2 text-[11px] text-slate-500 mt-0.5 flex-wrap">
                            <span className={`font-bold ${priceType === 'b2c' ? 'text-brand-600' : 'text-sage-600'}`}>{formatIDR(price)}</span>
                            <span className="text-slate-300">•</span>
                            <span className="px-1.5 py-0.2 rounded bg-slate-100 text-slate-600 text-[10px]">{p.sku}</span>
                            {priceType === 'b2b' && (
                              <>
                                <span className="text-slate-300">•</span>
                                <span className="px-1.5 py-0.2 rounded bg-sage-50 text-sage-800 border border-sage-200/80 text-[10px] font-bold">
                                  1 {p.b2bUnit || 'Karton'} = {p.b2bConversion || 12} Pcs
                                </span>
                              </>
                            )}
                          </div>
                        </div>
                      </div>
                      <div className="flex items-center gap-1.5 shrink-0">
                        <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-slate-100 text-slate-700">
                          Sisa {p.stock}
                        </span>
                        {isCur && <span className="text-brand-600 font-bold">✓</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Modern Modal with Drag-and-Drop Photo Upload for Tambah & Edit Produk
    function ProductFormModal({ isOpen, onClose, productToEdit, onSave }) {
      if (!isOpen) return null;
      const [name, setName] = useState(productToEdit?.name || '');
      const [sku, setSku] = useState(productToEdit?.sku || ('SQ-CK-' + Math.floor(100 + Math.random() * 900)));
      const DEFAULT_CATEGORIES = ['Cuanki', 'Keripik', 'Pilus', 'Paket Bundle'];
      const [categories, setCategories] = useState(() => {
        const saved = safeParse('sq_categories', DEFAULT_CATEGORIES);
        return (Array.isArray(saved) && saved.length > 0) ? saved : DEFAULT_CATEGORIES;
      });
      const [category, setCategory] = useState(productToEdit?.category || 'Cuanki');
      const [isCategoryOpen, setIsCategoryOpen] = useState(false);
      const [newCategoryInput, setNewCategoryInput] = useState('');
      const [showAddInput, setShowAddInput] = useState(false);
      const [b2cPrice, setB2cPrice] = useState(productToEdit?.b2cPrice || 18000);
      const [b2bPrice, setB2bPrice] = useState(productToEdit?.b2bPrice || 13000);
      const [hpp, setHpp] = useState(productToEdit?.hpp || 9000);
      const [b2bUnit, setB2bUnit] = useState(productToEdit?.b2bUnit || 'Karton');
      const [b2bConversion, setB2bConversion] = useState(productToEdit?.b2bConversion || 12);
      const [stock, setStock] = useState(productToEdit?.stock !== undefined ? productToEdit.stock : 50);
      const [desc, setDesc] = useState(productToEdit?.desc || '');
      const [imageUrl, setImageUrl] = useState(productToEdit?.image_url || productToEdit?.imageUrl || '');
      const [isDragging, setIsDragging] = useState(false);
      const fileRef = useRef(null);
      const newCatInputRef = useRef(null);

      useEffect(() => {
        const saved = safeParse('sq_categories', DEFAULT_CATEGORIES);
        const validCats = (Array.isArray(saved) && saved.length > 0) ? saved : DEFAULT_CATEGORIES;
        setCategories(validCats);
        if (productToEdit) {
          setName(productToEdit.name || '');
          setSku(productToEdit.sku || '');
          setCategory(productToEdit.category || (validCats[0] || 'Cuanki'));
          setB2cPrice(productToEdit.b2cPrice || 18000);
          setB2bPrice(productToEdit.b2bPrice || 13000);
          setHpp(productToEdit.hpp || 9000);
          setB2bUnit(productToEdit.b2bUnit || 'Karton');
          setB2bConversion(productToEdit.b2bConversion || 12);
          setStock(productToEdit.stock !== undefined ? productToEdit.stock : 50);
          setDesc(productToEdit.desc || '');
          setImageUrl(productToEdit.image_url || productToEdit.imageUrl || '');
        } else {
          setName('');
          setSku('SQ-CK-' + Math.floor(100 + Math.random() * 900));
          setCategory(validCats[0] || 'Cuanki');
          setB2cPrice(18000);
          setB2bPrice(13000);
          setHpp(9000);
          setB2bUnit('Karton');
          setB2bConversion(12);
          setStock(50);
          setDesc('');
          setImageUrl('');
        }
        setIsCategoryOpen(false);
        setNewCategoryInput('');
        setShowAddInput(false);
      }, [productToEdit, isOpen]);

      useEffect(() => {
        if (productToEdit && productToEdit.category) {
          if (!categories.includes(productToEdit.category)) {
            const updated = [...categories, productToEdit.category];
            setCategories(updated);
            localStorage.setItem('sq_categories', JSON.stringify(updated));
          }
        }
      }, [productToEdit]);

      const handleAddCategory = () => {
        const trimmed = newCategoryInput.trim();
        if (!trimmed) return;
        if (categories.some(c => c.toLowerCase() === trimmed.toLowerCase())) {
          alert(`Kategori "${trimmed}" sudah ada.`);
          return;
        }
        const updated = [...categories, trimmed];
        setCategories(updated);
        localStorage.setItem('sq_categories', JSON.stringify(updated));
        setCategory(trimmed);
        setNewCategoryInput('');
        setShowAddInput(false);
      };

      const handleDeleteCategory = (catToDelete) => {
        if (categories.length <= 1) {
          alert('Minimal harus ada 1 kategori.');
          return;
        }
        if (confirm(`Hapus kategori "${catToDelete}"?`)) {
          const updated = categories.filter(c => c !== catToDelete);
          setCategories(updated);
          localStorage.setItem('sq_categories', JSON.stringify(updated));
          if (category === catToDelete) {
            setCategory(updated[0] || '');
          }
        }
      };

      const handleFile = (file) => {
        if (!file.type.startsWith('image/')) {
          alert('Hanya file gambar (JPG, PNG, WebP) yang diperbolehkan.');
          return;
        }
        if (file.size > 5 * 1024 * 1024) {
          alert('Ukuran file maksimal 5MB.');
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          setImageUrl(e.target.result);
        };
        reader.readAsDataURL(file);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFile(e.dataTransfer.files[0]);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) {
          alert('Nama produk wajib diisi.');
          return;
        }
        onSave({
          id: productToEdit ? productToEdit.id : ('p-' + Date.now().toString().slice(-4)),
          sku: sku.trim(),
          name: name.trim(),
          category,
          b2cPrice: parseInt(b2cPrice || '0', 10) || 0,
          b2bPrice: parseInt(b2bPrice || '0', 10) || 0,
          hpp: parseInt(hpp || '0', 10) || 0,
          b2bUnit: ((b2bUnit || '').trim() || 'Karton'),
          b2bConversion: Math.max(1, parseInt(String(b2bConversion), 10) || 12),
          stock: parseInt(stock || '0', 10) || 0,
          status: (parseInt(stock || '0', 10) || 0) <= 0 ? 'habis' : 'aktif',
          desc: desc || (productToEdit ? productToEdit.description : '') || '',
          description: desc || (productToEdit ? productToEdit.description : '') || '',
          image_url: imageUrl,
          imageUrl: imageUrl
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 max-h-[92vh] overflow-y-auto">
            <div className="flex justify-between items-center pb-2 border-b border-slate-100">
              <h3 className="font-black text-sm text-slate-900">{productToEdit ? 'Edit Data & Foto Produk' : 'Tambah Produk Master Baru'}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              {/* Drag-and-Drop Image Area */}
              <div>
                <label className="font-bold text-slate-700 block mb-1">Foto Produk (Drag & Drop / Upload / URL)</label>
                <input
                  type="file"
                  ref={fileRef}
                  accept="image/*"
                  className="hidden"
                  onChange={(e) => { if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]); }}
                />

                {imageUrl ? (
                  <div className="p-3 bg-slate-50 border border-slate-200 rounded-2xl flex items-center gap-3">
                    <div className="w-16 h-16 rounded-xl overflow-hidden bg-white border border-slate-200 shrink-0 flex items-center justify-center shadow-2xs">
                      <img src={imageUrl} alt="Preview" className="w-full h-full object-cover" onError={(e)=>{e.target.src='https://placehold.co/80x80/E85D04/FFFFFF?text=SF';}} />
                    </div>
                    <div className="flex-1 min-w-0">
                      <span className="font-bold text-slate-800 block truncate text-xs">Foto Produk Terpilih</span>
                      <p className="text-[10px] text-slate-400 truncate mt-0.5">{imageUrl.startsWith('data:') ? 'Foto lokal tersimpan (Base64)' : imageUrl}</p>
                      <div className="flex items-center gap-2 mt-2">
                        <button
                          type="button"
                          onClick={() => fileRef.current?.click()}
                          className="px-2.5 py-1 bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-lg text-[10px] font-bold shadow-2xs"
                        >
                          Ganti Foto
                        </button>
                        <button
                          type="button"
                          onClick={() => setImageUrl('')}
                          className="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-[10px] font-bold"
                        >
                          Hapus Foto
                        </button>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div
                    onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                    onDragLeave={() => setIsDragging(false)}
                    onDrop={handleDrop}
                    onClick={() => fileRef.current?.click()}
                    className={`border-2 border-dashed rounded-2xl p-5 text-center cursor-pointer transition-all ${
                      isDragging ? 'border-brand-500 bg-brand-50' : 'border-slate-300 hover:border-brand-400 bg-slate-50/50 hover:bg-brand-50/20'
                    }`}
                  >
                    <div className="w-9 h-9 rounded-xl bg-brand-50 text-brand-500 mx-auto flex items-center justify-center text-lg mb-1.5">
                      📷
                    </div>
                    <span className="font-bold text-slate-800 block text-xs">
                      Tarik & lepas foto ke sini, atau <span className="text-brand-600 underline">pilih file</span>
                    </span>
                    <span className="text-[10px] text-slate-400 block mt-0.5">JPG, PNG, WebP (maks. 5MB)</span>
                  </div>
                )}

                <div className="mt-1.5">
                  <input
                    type="url"
                    value={imageUrl}
                    placeholder="Atau tempel URL gambar (https://...)"
                    onChange={(e) => setImageUrl(e.target.value)}
                    className="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 text-[11px] focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Nama Produk *</label>
                <input
                  name="name"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  required
                  placeholder="Contoh: Cuanki Geprek Extra Pedas"
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Kode SKU *</label>
                  <input
                    name="sku"
                    value={sku}
                    onChange={(e) => setSku(e.target.value)}
                    required
                    placeholder="SQ-CK-GP"
                    className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>
                <div className="relative">
                  <div className="flex items-center justify-between mb-1">
                    <label className="font-bold text-slate-700 block">Kategori *</label>
                    <button
                      type="button"
                      onClick={() => {
                        setIsCategoryOpen(true);
                        setShowAddInput(true);
                        setTimeout(() => newCatInputRef.current?.focus(), 50);
                      }}
                      className="text-[11px] font-bold text-brand-600 hover:text-brand-700 hover:underline flex items-center gap-0.5"
                    >
                      + Tambah
                    </button>
                  </div>

                  {/* Custom Dropdown Trigger */}
                  <button
                    type="button"
                    onClick={() => setIsCategoryOpen(!isCategoryOpen)}
                    className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-left flex items-center justify-between text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 hover:bg-slate-100/70 transition-colors"
                  >
                    <span className="font-semibold truncate">{category || 'Pilih Kategori'}</span>
                    <svg className={`w-4 h-4 text-slate-400 shrink-0 ml-1 transition-transform ${isCategoryOpen ? 'rotate-180' : ''}`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                  </button>

                  {/* Dropdown Popover */}
                  {isCategoryOpen && (
                    <>
                      <div 
                        className="fixed inset-0 z-30" 
                        onClick={() => setIsCategoryOpen(false)} 
                      />
                      <div className="absolute right-0 w-[300px] sm:w-[320px] max-w-[calc(100vw-3rem)] z-40 mt-1 bg-white border border-slate-200 rounded-2xl shadow-2xl p-2.5 space-y-2">
                        {/* Area Tambah Kategori Baru */}
                        <div className="flex items-center gap-1.5 p-1.5 bg-slate-50 rounded-xl border border-slate-200/80">
                          <input
                            ref={newCatInputRef}
                            type="text"
                            placeholder="Ketik kategori baru..."
                            value={newCategoryInput}
                            onChange={(e) => setNewCategoryInput(e.target.value)}
                            onKeyDown={(e) => {
                              if (e.key === 'Enter') {
                                e.preventDefault();
                                handleAddCategory();
                              }
                            }}
                            className="flex-1 px-2.5 py-1 text-xs bg-white border border-slate-200 rounded-lg text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand-500"
                            autoFocus={showAddInput}
                          />
                          <button
                            type="button"
                            onClick={handleAddCategory}
                            className="px-2.5 py-1 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-lg text-xs shrink-0 transition-colors shadow-2xs"
                          >
                            + Tambah
                          </button>
                        </div>

                        {/* List Kategori dengan Ikon Trash Merah */}
                        <div className="max-h-44 overflow-y-auto space-y-1 custom-scrollbar">
                          {categories.map((cat) => (
                            <div
                              key={cat}
                              onClick={() => {
                                setCategory(cat);
                                setIsCategoryOpen(false);
                              }}
                              className={`flex items-center justify-between px-2.5 py-1.5 rounded-xl text-xs cursor-pointer transition-colors ${
                                category === cat
                                  ? 'bg-brand-50 text-brand-700 font-bold border border-brand-200/60'
                                  : 'hover:bg-slate-50 text-slate-700'
                              }`}
                            >
                              <div className="flex items-center gap-2 min-w-0">
                                <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${category === cat ? 'bg-brand-500' : 'bg-slate-300'}`} />
                                <span className="truncate">{cat}</span>
                              </div>
                              <button
                                type="button"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  handleDeleteCategory(cat);
                                }}
                                title={`Hapus kategori "${cat}"`}
                                className="p-1 text-rose-500 hover:text-white hover:bg-rose-500 rounded-lg transition-colors ml-2 shrink-0"
                              >
                                <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                  <polyline points="3 6 5 6 21 6"></polyline>
                                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                  <line x1="10" y1="11" x2="10" y2="17"></line>
                                  <line x1="14" y1="11" x2="14" y2="17"></line>
                                </svg>
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    </>
                  )}
                </div>
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Harga B2C (Retail) *</label>
                  <input
                    type="number"
                    value={b2cPrice}
                    onChange={(e) => setB2cPrice(e.target.value)}
                    required
                    placeholder="18000"
                    className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Harga Grosir B2B *</label>
                  <input
                    type="number"
                    value={b2bPrice}
                    onChange={(e) => setB2bPrice(e.target.value)}
                    required
                    placeholder="13000"
                    className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>
                <div>
                  <label className="font-bold text-amber-900 block mb-1">HPP (Modal Produksi per pcs) *</label>
                  <input
                    type="number"
                    value={hpp}
                    onChange={(e) => setHpp(e.target.value)}
                    required
                    placeholder="9000"
                    className="w-full px-3 py-2 bg-amber-50/50 border border-amber-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 font-semibold"
                  />
                  <span className="text-[10px] text-amber-800 mt-0.5 block">Modal produksi bahan baku & kemasan per pcs</span>
                </div>
              </div>

              {/* Margin Reseller (Potensi Laba Toko) */}
              <div className="p-2.5 bg-emerald-50 border border-emerald-200 rounded-xl flex items-center justify-between text-xs">
                <span className="text-slate-600 font-semibold">Margin Reseller (Potensi Laba Toko):</span>
                <span className="font-extrabold text-emerald-700 bg-white px-2 py-0.5 rounded-lg border border-emerald-200">
                  +{formatIDR(Math.max(0, (parseInt(b2cPrice || '0', 10) || 0) - (parseInt(b2bPrice || '0', 10) || 0)))} (
                  {parseInt(b2cPrice || '0', 10) > 0 ? Math.round((Math.max(0, (parseInt(b2cPrice || '0', 10) || 0) - (parseInt(b2bPrice || '0', 10) || 0)) / parseInt(b2cPrice || '0', 10)) * 100) : 0}% margin)
                </span>
              </div>

              {/* Pengaturan Satuan Jual B2B & Konversi Isi */}
              <div className="grid grid-cols-2 gap-3 p-3 bg-sage-50/50 border border-sage-200/80 rounded-2xl">
                <div>
                  <label className="font-bold text-sage-900 block mb-1">Nama Satuan Grosir *</label>
                  <input
                    type="text"
                    value={b2bUnit}
                    onChange={(e) => setB2bUnit(e.target.value)}
                    required
                    placeholder="Karton, Dus, Bal, Pack"
                    className="w-full px-3 py-2 bg-white border border-sage-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-500 font-semibold"
                  />
                  <span className="text-[10px] text-sage-700 mt-0.5 block">Misal: Karton, Dus, Pack, Bal</span>
                </div>
                <div>
                  <label className="font-bold text-sage-900 block mb-1">Isi per Satuan Grosir *</label>
                  <input
                    type="number"
                    min="1"
                    value={b2bConversion}
                    onChange={(e) => setB2bConversion(e.target.value)}
                    required
                    placeholder="12"
                    className="w-full px-3 py-2 bg-white border border-sage-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-500 font-bold"
                  />
                  <span className="text-[10px] text-sage-700 mt-0.5 block font-medium">1 {b2bUnit || 'Karton'} = {b2bConversion || 12} Pcs</span>
                </div>
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Stok Fisik (pcs)</label>
                <input
                  type="number"
                  value={stock}
                  onChange={(e) => setStock(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Deskripsi / Varian Rasa</label>
                <textarea
                  rows="2"
                  value={desc}
                  onChange={(e) => setDesc(e.target.value)}
                  placeholder="Keterangan bumbu, rasa, keunggulan cemilan..."
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
              </div>

              <div className="pt-2 flex justify-end gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 bg-slate-100 rounded-xl font-bold text-slate-600 hover:bg-slate-200 transition-colors"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 bg-brand-500 hover:bg-brand-600 text-white rounded-xl font-bold shadow-md transition-all active:scale-95"
                >
                  {productToEdit ? 'Simpan Perubahan' : 'Simpan Produk'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const MONTH_NAMES_ID = [
      'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
      'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
    ];

    const MONTH_SHORT_ID = [
      'Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun',
      'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'
    ];

    const formatMonthName = (monthKey) => {
      if (!monthKey || monthKey === 'all') return 'Semua Waktu';
      const parts = monthKey.split('-');
      if (parts.length < 2) return monthKey;
      const y = parts[0];
      const m = parseInt(parts[1], 10);
      const name = MONTH_NAMES_ID[m - 1] || parts[1];
      return `${name} ${y}`;
    };

    const formatMonthShort = (monthKey) => {
      if (!monthKey || monthKey === 'all') return 'Semua Waktu';
      const parts = monthKey.split('-');
      if (parts.length < 2) return monthKey;
      const y = parts[0];
      const m = parseInt(parts[1], 10);
      const name = MONTH_SHORT_ID[m - 1] || parts[1];
      return `${name} '${y.slice(2)}`;
    };

    const formatRupiahCompact = (val) => {
      if (!val || val === 0) return 'Rp 0';
      if (val >= 1000000) {
        const jt = val / 1000000;
        return `Rp ${jt % 1 === 0 ? jt.toFixed(0) : jt.toFixed(1)}Jt`;
      }
      if (val >= 1000) {
        return `Rp ${(val / 1000).toFixed(0)}rb`;
      }
      return `Rp ${val}`;
    };

    const getTransactionMonth = (item) => {
      if (!item) return '';
      const d = item.orderDate || item.order_date || item.settlementDate || item.settlement_date || item.date || item.createdAt || item.created_at;
      if (!d) return '';
      const str = String(d).trim();
      const m = str.match(/^(\d{4})-(\d{2})/);
      if (m) return `${m[1]}-${m[2]}`;
      const parsed = new Date(str);
      if (!isNaN(parsed.getTime())) {
        const y = parsed.getFullYear();
        const mo = String(parsed.getMonth() + 1).padStart(2, '0');
        return `${y}-${mo}`;
      }
      return '';
    };

    const createSmoothPath = (points) => {
      if (!points || points.length === 0) return '';
      if (points.length === 1) return `M ${points[0].x} ${points[0].y}`;
      let path = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i === 0 ? 0 : i - 1];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2 < points.length ? i + 2 : i + 1];
        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;
        path += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
      }
      return path;
    };

    function SalesTrendChart({ orders, settlements, products, selectedMonth, onSelectMonth }) {
      const [hoveredIndex, setHoveredIndex] = useState(null);

      const getOrderProfit = (o) => {
        if (o.grossProfit !== undefined) return o.grossProfit;
        if (o.items && Array.isArray(o.items) && o.items.length > 0) {
          return o.items.reduce((iSum, it) => {
            const p = products.find(prod => prod.id === it.productId || (it.productName && prod.name && prod.name.toLowerCase() === it.productName.toLowerCase()));
            const hpp = it.hpp !== undefined ? it.hpp : (p?.hpp || 0);
            const uPrice = it.unitPrice || p?.b2cPrice || 0;
            const pcs = it.totalPcs || it.quantityInPcs || it.quantity || 1;
            return iSum + ((uPrice - hpp) * pcs);
          }, 0);
        }
        const p = products.find(prod => prod.id === o.productId || (o.productName && prod.name && prod.name.toLowerCase() === o.productName.toLowerCase()));
        const hpp = o.hpp !== undefined ? o.hpp : (p?.hpp || 0);
        const pcs = o.totalPcs || o.quantityInPcs || o.quantity || 1;
        const uPrice = o.unitPrice !== undefined ? o.unitPrice : ((o.total || o.totalAmount || 0) / (pcs || 1));
        return (uPrice - hpp) * pcs;
      };

      const getSettlementProfit = (s) => {
        if (s.grossProfit !== undefined) return s.grossProfit;
        if (s.items && Array.isArray(s.items) && s.items.length > 0) {
          return s.items.reduce((iSum, it) => {
            const p = products.find(prod => prod.id === it.productId || (it.productName && prod.name && prod.name.toLowerCase() === it.productName.toLowerCase()));
            const hpp = it.hpp !== undefined ? it.hpp : (p?.hpp || 0);
            const conv = it.conv || it.b2bConversion || p?.b2bConversion || 12;
            const pcs = it.totalOrderPcs || it.quantitySoldPcs || it.quantityInPcs || ((it.parsedOrderQty || it.qty || it.quantity || 1) * conv);
            const uPrice = it.unitPrice || it.b2bPrice || p?.b2bPrice || 0;
            return iSum + ((uPrice - hpp) * pcs);
          }, 0);
        }
        const p = products.find(prod => prod.id === s.productId || (s.productName && prod.name && (prod.name.toLowerCase() === s.productName.toLowerCase() || prod.name.toLowerCase().replace(/[^a-z0-9]/g, '').includes(s.productName.toLowerCase().replace(/[^a-z0-9]/g, '')))));
        const hpp = s.hpp !== undefined ? s.hpp : (p?.hpp || 0);
        const conv = s.b2bConversion || p?.b2bConversion || 12;
        const pcs = s.qtyPcs || s.quantitySoldPcs || ((s.qty || s.quantitySold || 1) * conv);
        const b2bUnitPrice = s.b2bPrice || p?.b2bPrice || ((s.totalCollected || s.totalCollectedAmount || 0) / (pcs || 1));
        return (b2bUnitPrice - hpp) * pcs;
      };

      const monthlyData = useMemo(() => {
        const monthsSet = new Set();
        const baseYear = 2026;
        const baseMonth = 11;
        for (let i = 5; i >= 0; i--) {
          const d = new Date(baseYear, baseMonth - 1 - i, 1);
          const y = d.getFullYear();
          const mo = String(d.getMonth() + 1).padStart(2, '0');
          monthsSet.add(`${y}-${mo}`);
        }
        orders.forEach(o => {
          const m = getTransactionMonth(o);
          if (m) monthsSet.add(m);
        });
        settlements.forEach(s => {
          const m = getTransactionMonth(s);
          if (m) monthsSet.add(m);
        });

        const sorted = Array.from(monthsSet).sort();

        return sorted.map(mKey => {
          const mOrders = orders.filter(o => getTransactionMonth(o) === mKey);
          const mSettlements = settlements.filter(s => getTransactionMonth(s) === mKey);

          const b2cRev = mOrders.reduce((sum, o) => sum + (o.total || o.totalAmount || 0), 0);
          const b2bRev = mSettlements.reduce((sum, s) => sum + (s.totalCollected || s.totalCollectedAmount || 0), 0);
          const totalOmzet = b2cRev + b2bRev;

          const b2cProfit = mOrders.reduce((sum, o) => sum + getOrderProfit(o), 0);
          const b2bProfit = mSettlements.reduce((sum, s) => sum + getSettlementProfit(s), 0);
          const totalProfit = b2cProfit + b2bProfit;
          const margin = totalOmzet > 0 ? (totalProfit / totalOmzet) * 100 : 0;

          return {
            key: mKey,
            label: formatMonthName(mKey),
            shortLabel: formatMonthShort(mKey),
            totalOmzet,
            totalProfit,
            b2cRev,
            b2bRev,
            b2cProfit,
            b2bProfit,
            b2cCount: mOrders.length,
            b2bCount: mSettlements.length,
            totalTx: mOrders.length + mSettlements.length,
            margin: Math.round(margin * 10) / 10
          };
        });
      }, [orders, settlements, products]);

      const chartWidth = 760;
      const chartHeight = 240;
      const paddingLeft = 70;
      const paddingRight = 35;
      const paddingTop = 25;
      const paddingBottom = 45;

      const innerW = chartWidth - paddingLeft - paddingRight;
      const innerH = chartHeight - paddingTop - paddingBottom;
      const nPoints = monthlyData.length;

      const maxVal = useMemo(() => {
        const rawMax = Math.max(...monthlyData.map(d => Math.max(d.totalOmzet, d.totalProfit)), 1000000);
        // Round to clean ceiling divisible by 3 for perfectly formatted integer rupiah steps (e.g. Rp 2Jt, Rp 4Jt, Rp 6Jt)
        if (rawMax <= 1200000) return 1200000;
        if (rawMax <= 2400000) return 2400000;
        if (rawMax <= 3000000) return 3000000;
        if (rawMax <= 6000000) return 6000000;
        return Math.ceil(rawMax / 1200000) * 1200000;
      }, [monthlyData]);

      const pointsOmzet = useMemo(() => {
        return monthlyData.map((d, i) => {
          const x = nPoints > 1 ? paddingLeft + (i / (nPoints - 1)) * innerW : paddingLeft + innerW / 2;
          const y = paddingTop + innerH - (d.totalOmzet / maxVal) * innerH;
          return { x, y, data: d };
        });
      }, [monthlyData, nPoints, innerW, innerH, paddingLeft, paddingTop, maxVal]);

      const pointsProfit = useMemo(() => {
        return monthlyData.map((d, i) => {
          const x = nPoints > 1 ? paddingLeft + (i / (nPoints - 1)) * innerW : paddingLeft + innerW / 2;
          const y = paddingTop + innerH - (d.totalProfit / maxVal) * innerH;
          return { x, y, data: d };
        });
      }, [monthlyData, nPoints, innerW, innerH, paddingLeft, paddingTop, maxVal]);

      const omzetLinePath = useMemo(() => createSmoothPath(pointsOmzet), [pointsOmzet]);
      const omzetAreaPath = useMemo(() => {
        if (pointsOmzet.length === 0) return '';
        const last = pointsOmzet[pointsOmzet.length - 1];
        const first = pointsOmzet[0];
        const baseline = paddingTop + innerH;
        return `${omzetLinePath} L ${last.x.toFixed(1)} ${baseline} L ${first.x.toFixed(1)} ${baseline} Z`;
      }, [omzetLinePath, pointsOmzet, paddingTop, innerH]);

      const profitLinePath = useMemo(() => createSmoothPath(pointsProfit), [pointsProfit]);
      const profitAreaPath = useMemo(() => {
        if (pointsProfit.length === 0) return '';
        const last = pointsProfit[pointsProfit.length - 1];
        const first = pointsProfit[0];
        const baseline = paddingTop + innerH;
        return `${profitLinePath} L ${last.x.toFixed(1)} ${baseline} L ${first.x.toFixed(1)} ${baseline} Z`;
      }, [profitLinePath, pointsProfit, paddingTop, innerH]);

      // Y-axis grid levels (4 clean steps: 0, 1/3, 2/3, 3/3 of maxVal)
      const gridLevels = [0, Math.round(maxVal / 3), Math.round((maxVal * 2) / 3), maxVal];

      const totalAggregatedOmzet = useMemo(() => monthlyData.reduce((sum, d) => sum + d.totalOmzet, 0), [monthlyData]);
      const totalAggregatedProfit = useMemo(() => monthlyData.reduce((sum, d) => sum + d.totalProfit, 0), [monthlyData]);
      const avgMargin = totalAggregatedOmzet > 0 ? Math.round((totalAggregatedProfit / totalAggregatedOmzet) * 100) : 0;
      const peakMonth = useMemo(() => {
        if (monthlyData.length === 0) return null;
        return [...monthlyData].sort((a, b) => b.totalOmzet - a.totalOmzet)[0];
      }, [monthlyData]);

      const hoveredData = hoveredIndex !== null ? monthlyData[hoveredIndex] : null;
      const hoveredPoint = hoveredIndex !== null ? pointsOmzet[hoveredIndex] : null;

      return (
        <div className="bg-white rounded-3xl p-6 sm:p-7 border border-[#EAE6CE] shadow-subtle relative overflow-hidden">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div>
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-2xl bg-brand-50 text-brand-500 flex items-center justify-center shadow-xs">
                  <i data-lucide="trending-up" className="w-5 h-5"></i>
                </div>
                <div>
                  <h2 className="text-base sm:text-lg font-black text-slate-900 tracking-tight flex items-center gap-2">
                    Grafik Tren Penjualan & Laba Kotor
                    <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 text-[10px] font-bold border border-emerald-200">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                      Real-time DB Sync
                    </span>
                  </h2>
                  <p className="text-xs text-slate-500 mt-0.5">
                    Pergerakan naik-turun Total Omzet vs Laba Kotor per bulan dari transaksi riil B2C & Grosir B2B
                  </p>
                </div>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              <div className="flex items-center gap-4 bg-slate-50 px-3.5 py-1.5 rounded-2xl border border-slate-200/80 text-xs">
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-[#E85D04] shadow-xs"></span>
                  <span className="font-bold text-slate-800">Total Omzet</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-[#40796C] shadow-xs"></span>
                  <span className="font-bold text-slate-800">Laba Kotor</span>
                </div>
              </div>

              {selectedMonth && selectedMonth !== 'all' && (
                <button
                  onClick={() => onSelectMonth && onSelectMonth('all')}
                  className="text-[11px] font-bold text-brand-600 hover:text-brand-700 bg-brand-50 px-3 py-1.5 rounded-xl border border-brand-200 transition-colors flex items-center gap-1"
                >
                  <span>Periode: <strong>{formatMonthShort(selectedMonth)}</strong></span>
                  <span className="text-xs">✕</span>
                </button>
              )}
            </div>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6 p-3 bg-gradient-to-r from-slate-50 via-slate-50/70 to-emerald-50/40 rounded-2xl border border-slate-200/60 text-xs">
            <div>
              <span className="text-[11px] text-slate-500 block">Akumulasi Omzet (Tren)</span>
              <span className="font-extrabold text-[#E85D04] text-sm">{formatIDR(totalAggregatedOmzet)}</span>
            </div>
            <div>
              <span className="text-[11px] text-slate-500 block">Akumulasi Laba Kotor</span>
              <span className="font-extrabold text-[#40796C] text-sm">{formatIDR(totalAggregatedProfit)}</span>
            </div>
            <div>
              <span className="text-[11px] text-slate-500 block">Rata-rata Margin Kotor</span>
              <span className="font-extrabold text-emerald-700 text-sm">{avgMargin}% dari Omzet</span>
            </div>
            <div>
              <span className="text-[11px] text-slate-500 block">Bulan Puncak (Peak)</span>
              <span className="font-extrabold text-slate-900 text-sm">
                {peakMonth ? `${peakMonth.shortLabel} (${formatIDR(peakMonth.totalOmzet)})` : '-'}
              </span>
            </div>
          </div>

          <div className="relative w-full">
            {hoveredData && hoveredPoint && (
              <div
                className="absolute pointer-events-none z-30 bg-[#2B1E16] text-white rounded-2xl p-4 shadow-2xl border border-white/15 text-xs transition-all duration-150"
                style={{
                  left: `${Math.min(Math.max(18, (hoveredPoint.x / chartWidth) * 100), 82)}%`,
                  top: '10px',
                  transform: 'translateX(-50%)'
                }}
              >
                <div className="flex items-center justify-between gap-4 pb-2 border-b border-white/15">
                  <span className="font-extrabold text-[#F4F1DE] flex items-center gap-1.5">
                    <span>📅</span> {hoveredData.label}
                  </span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-white/15 text-white">
                    {hoveredData.totalTx} Transaksi
                  </span>
                </div>

                <div className="pt-2.5 space-y-2 text-[11px]">
                  <div className="flex items-center justify-between gap-6">
                    <span className="flex items-center gap-2 text-white/80">
                      <span className="w-2.5 h-2.5 rounded-full bg-[#E85D04]"></span> Total Omzet:
                    </span>
                    <span className="font-extrabold text-[#E85D04] text-xs">
                      {formatIDR(hoveredData.totalOmzet)}
                    </span>
                  </div>

                  <div className="flex items-center justify-between gap-6">
                    <span className="flex items-center gap-2 text-white/80">
                      <span className="w-2.5 h-2.5 rounded-full bg-[#40796C]"></span> Laba Kotor:
                    </span>
                    <span className="font-extrabold text-[#98C0B6] text-xs">
                      {formatIDR(hoveredData.totalProfit)} ({hoveredData.margin}%)
                    </span>
                  </div>

                  <div className="pt-2 border-t border-white/10 grid grid-cols-2 gap-2 text-[10px] text-white/70">
                    <div>
                      <span className="text-white/40 block">Retail B2C:</span>
                      <span className="font-semibold text-white">{formatIDR(hoveredData.b2cRev)}</span>
                    </div>
                    <div>
                      <span className="text-white/40 block">Grosir B2B:</span>
                      <span className="font-semibold text-white">{formatIDR(hoveredData.b2bRev)}</span>
                    </div>
                  </div>
                </div>

                <div className="mt-2 text-[10px] text-white/50 text-center italic">
                  Klik titik bulan untuk memfilter Dashboard
                </div>
              </div>
            )}

            <svg
              viewBox={`0 0 ${chartWidth} ${chartHeight}`}
              className="w-full h-64 sm:h-72 select-none overflow-visible"
            >
              <defs>
                <linearGradient id="distOmzetGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#E85D04" stopOpacity="0.32" />
                  <stop offset="70%" stopColor="#E85D04" stopOpacity="0.08" />
                  <stop offset="100%" stopColor="#E85D04" stopOpacity="0.0" />
                </linearGradient>
                <linearGradient id="distProfitGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#40796C" stopOpacity="0.36" />
                  <stop offset="70%" stopColor="#40796C" stopOpacity="0.09" />
                  <stop offset="100%" stopColor="#40796C" stopOpacity="0.0" />
                </linearGradient>
                <filter id="distGlowOrange" x="-50%" y="-50%" width="200%" height="200%">

          if (s.items && Array.isArray(s.items) && s.items.length > 0) {
            const itemsProfit = s.items.reduce((iSum, it) => {
              const p = products.find(prod => prod.id === it.productId || (it.productName && prod.name && prod.name.toLowerCase() === it.productName.toLowerCase()));
              const hpp = it.hpp !== undefined ? it.hpp : (p?.hpp || 0);
              const conv = it.conv || it.b2bConversion || p?.b2bConversion || 12;
              const pcs = it.totalOrderPcs || it.quantitySoldPcs || it.quantityInPcs || ((it.parsedOrderQty || it.qty || it.quantity || 1) * conv);
              const uPrice = it.unitPrice || it.b2bPrice || p?.b2bPrice || 0;
              return iSum + ((uPrice - hpp) * pcs);
            }, 0);
            return sum + itemsProfit;
          }
          const p = products.find(prod => prod.id === s.productId || (s.productName && prod.name && (prod.name.toLowerCase() === s.productName.toLowerCase() || prod.name.toLowerCase().replace(/[^a-z0-9]/g, '').includes(s.productName.toLowerCase().replace(/[^a-z0-9]/g, '')))));
          const hpp = s.hpp !== undefined ? s.hpp : (p?.hpp || 0);
          const conv = s.b2bConversion || p?.b2bConversion || 12;
          const pcs = s.qtyPcs || s.quantitySoldPcs || ((s.qty || s.quantitySold || 1) * conv);
          const b2bUnitPrice = s.b2bPrice || p?.b2bPrice || ((s.totalCollected || s.totalCollectedAmount || 0) / (pcs || 1));
          return sum + ((b2bUnitPrice - hpp) * pcs);
        }, 0);

        const totProfit = b2cProfit + b2bProfit;
        const margin = totRev > 0 ? Math.round((totProfit / totRev) * 100) : 0;

        return {
          filteredOrders: fOrders,
          filteredSettlements: fSettlements,
          displayedB2CRevenue: b2cRev,
          displayedB2BRevenue: b2bRev,
          displayedTotalRevenue: totRev,
          displayedB2CGrossProfit: b2cProfit,
          displayedB2BGrossProfit: b2bProfit,
          displayedTotalGrossProfit: totProfit,
          displayedMarginPercent: margin
        };
      }, [selectedMonth, orders, settlements, b2cRevenue, b2bRevenue, totalGrossProfit, b2cGrossProfit, b2bGrossProfit, products]);
      const validOrdersForFollowUp = useMemo(() => {
        return orders.filter(o => {
          const oPhone = cleanPhone(o.phone || o.customerPhone);
          return customers.some(c => 
            (o.customerId && c.id === o.customerId) ||
            (oPhone && cleanPhone(c.phone) === oPhone) ||
            (o.customerName && c.name && c.name.toLowerCase() === o.customerName.toLowerCase())
          );
        });
      }, [orders, customers]);

      const dueH2Count = useMemo(() => validOrdersForFollowUp.filter(o => (o.stage || o.pipelineStage) === 'h_plus_2').length, [validOrdersForFollowUp]);
      const dueH30Count = useMemo(() => validOrdersForFollowUp.filter(o => (o.stage || o.pipelineStage) === 'h_plus_30').length, [validOrdersForFollowUp]);

      // Subtab State for Pelanggan Retail
      const [customerSubTab, setCustomerSubTab] = useState('customers');

      // Revert / Undo Wholesale Settlement (B2B Cash & Carry)
      const handleDeleteSettlement = (st) => {
        if (!window.confirm('Yakin ingin membatalkan dan menghapus transaksi ini?')) {
          return;
        }

        const amountToRevert = parseInt(st.totalCollected || st.totalCollectedAmount || 0, 10) || 0;
        const qtyCartons = parseInt(st.qty || st.quantitySold || 1, 10) || 1;

        // 1. Revert Stock in Master Produk (supports multi-item cart & single product)
        const isProductMatch = (p, targetId, targetName) => {
          if (targetId && p.id === targetId) return true;
          if (targetName && p.name) {
            const sName = targetName.toLowerCase().replace(/[^a-z0-9]/g, '');
            const pName = p.name.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (sName === pName || sName.includes(pName) || pName.includes(sName)) return true;
          }
          return false;
        };

        const itemsToRestore = [];
        if (st.items && Array.isArray(st.items) && st.items.length > 0) {
          st.items.forEach(it => {
            const itConv = it.conv || it.b2bConversion || 12;
            const itPcs = parseInt(it.totalOrderPcs || it.quantitySoldPcs || it.totalPcs || it.quantityInPcs || ((it.parsedOrderQty || it.qty || it.quantity || 1) * itConv), 10) || 1;
            itemsToRestore.push({
              productId: it.productId || it.product?.id,
              productName: it.productName || it.product?.name,
              pcs: itPcs
            });
          });
        } else {
          const matchedProduct = products.find(p => isProductMatch(p, st.productId, st.productName));
          const conversion = matchedProduct?.b2bConversion || st.b2bConversion || st.conversion || 12;
          const restorePcs = parseInt(st.qtyPcs || st.quantitySoldPcs || (qtyCartons * conversion), 10) || (qtyCartons * conversion);
          itemsToRestore.push({
            productId: st.productId,
            productName: st.productName,
            pcs: restorePcs
          });
        }

        const updatedProducts = products.map(p => {
          const matchingItems = itemsToRestore.filter(it => isProductMatch(p, it.productId, it.productName));
          const restoreQty = matchingItems.reduce((sum, it) => sum + it.pcs, 0);
          if (!restoreQty) return p;
          const newStock = (parseInt(p.stock, 10) || 0) + restoreQty;
          return {
            ...p,
            stock: newStock,
            status: newStock > 0 && p.status === 'habis' ? 'aktif' : p.status
          };
        });
        setProducts(updatedProducts);
        try {
          localStorage.setItem('sq_products', JSON.stringify(updatedProducts));
          localStorage.setItem('shaqueen_crm_products_v1', JSON.stringify(updatedProducts));
        } catch(e) {}

        // 2. Revert Partner Data (Total Akumulasi Pembelian & Total Karton)
        const updatedPartners = partners.map(pt => {
          const isMatch = (st.partnerId && pt.id === st.partnerId) ||
            (st.partnerName && pt.storeName && (
              pt.storeName.toLowerCase() === st.partnerName.toLowerCase() ||
              pt.storeName.toLowerCase().replace(/[^a-z0-9]/g, '').includes(st.partnerName.toLowerCase().replace(/[^a-z0-9]/g, ''))
            ));
          if (!isMatch) return pt;

          const partnerTx = settlements.filter(s => s.partnerId === pt.id || (st.partnerName && s.partnerName && s.partnerName.toLowerCase() === st.partnerName.toLowerCase()));
          const txPurchases = partnerTx.reduce((sum, s) => sum + (s.totalCollected || s.totalCollectedAmount || 0), 0);
          const txCartons = partnerTx.reduce((sum, s) => sum + (s.qty || s.quantitySold || 0), 0);

          const currentCartons = pt.totalPurchasedCartons !== undefined ? pt.totalPurchasedCartons : txCartons;
          const currentAmount = pt.totalSettledAmount !== undefined ? pt.totalSettledAmount : txPurchases;

          return {
            ...pt,
            totalPurchasedCartons: Math.max(0, currentCartons - qtyCartons),
            totalSettledAmount: Math.max(0, currentAmount - amountToRevert)
          };
        });
        setPartners(updatedPartners);
        try {
          localStorage.setItem('sq_partners', JSON.stringify(updatedPartners));
          localStorage.setItem('shaqueen_crm_partners_v1', JSON.stringify(updatedPartners));
        } catch(e) {}

        // 3. Remove settlement from settlements
        const updatedSettlements = settlements.filter(s => s.id !== st.id);
        setSettlements(updatedSettlements);
        try {
          localStorage.setItem('sq_settlements', JSON.stringify(updatedSettlements));
          localStorage.setItem('shaqueen_crm_settlements_v1', JSON.stringify(updatedSettlements));
        } catch(e) {}

        // 4. Cascade Delete: Remove associated WhatsApp logs
        const updatedLogs = waLogs.filter(l => l.orderId !== st.id);
        setWaLogs(updatedLogs);
        try {
          localStorage.setItem('sq_wa_logs', JSON.stringify(updatedLogs));
          localStorage.setItem('shaqueen_crm_wa_logs_v1', JSON.stringify(updatedLogs));
        } catch(e) {}

        if (typeof window !== 'undefined') {
          window.dispatchEvent(new CustomEvent('shaqueen-data-changed', { detail: { action: 'deleteSettlement', id: st.id } }));
        }

        showToast(`Transaksi grosir ${st.partnerName} (${formatIDR(amountToRevert)}) berhasil dibatalkan. Stok dikembalikan ke gudang.`);
      };

      // Revert / Undo Retail Order (B2C)
      const handleDeleteOrder = (ord) => {

            itemsToRestore.push({
              productId: it.productId,
              productName: it.productName,
              pcs: itPcs
            });
          });
        } else {
          const pcs = parseInt(ord.totalPcs || ord.quantityInPcs || ord.quantity || 1, 10) || 1;
          itemsToRestore.push({
            productId: ord.productId,
            productName: ord.productName,
            pcs: pcs
          });
        }

        const updatedProducts = products.map(p => {
          const matchingItems = itemsToRestore.filter(it => {
            if (it.productId && p.id && it.productId === p.id) return true;
            if (it.productName && p.name) {
              const n1 = p.name.toLowerCase().replace(/[^a-z0-9]/g, '');
              const n2 = it.productName.toLowerCase().replace(/[^a-z0-9]/g, '');
              if (n1 === n2 || n1.includes(n2) || n2.includes(n1)) return true;
            }
            return false;
          });
          const restoreQty = matchingItems.reduce((sum, it) => sum + it.pcs, 0);
          if (!restoreQty) return p;

          const newStock = (parseInt(p.stock, 10) || 0) + restoreQty;
          return {
            ...p,
            stock: newStock,
            status: newStock > 0 && p.status === 'habis' ? 'aktif' : p.status
          };
        });
        setProducts(updatedProducts);
        try {
          localStorage.setItem('sq_products', JSON.stringify(updatedProducts));
          localStorage.setItem('shaqueen_crm_products_v1', JSON.stringify(updatedProducts));
        } catch(e) {}

        // 2. Revert Customer Metrics (Total Orders -1, Total Belanja LTV - amountToRevert)
        const ordPhoneClean = cleanPhone(ord.phone || ord.customerPhone);
        const updatedCustomers = customers.map(c => {
          const isMatch = (ord.customerId && c.id === ord.customerId) ||
            (ordPhoneClean && cleanPhone(c.phone) === ordPhoneClean) ||
            (ord.customerName && c.name && c.name.toLowerCase() === ord.customerName.toLowerCase());
          if (!isMatch) return c;

          const custOrders = orders.filter(o => 
            (c.id && o.customerId === c.id) ||
            (ordPhoneClean && cleanPhone(o.phone || o.customerPhone) === ordPhoneClean) ||
            (c.name && o.customerName && c.name.toLowerCase() === o.customerName.toLowerCase())
          );
          const txOrderCount = custOrders.length;
          const txTotalSpent = custOrders.reduce((sum, o) => sum + (o.total || o.totalAmount || 0), 0);

          const currentOrders = c.totalOrders !== undefined ? (parseInt(c.totalOrders, 10) || 0) : txOrderCount;
          const currentSpent = c.totalSpent !== undefined ? (parseInt(c.totalSpent, 10) || 0) : txTotalSpent;
          const newTotalOrders = Math.max(0, currentOrders - 1);
          const newTotalSpent = Math.max(0, currentSpent - amountToRevert);

          let newTag = c.tag;
          if (newTotalOrders < 3 && (c.tag === 'Loyal' || c.tag === 'Pelanggan Loyal')) {
            newTag = 'Baru';
          }
          return {
            ...c,
            totalOrders: newTotalOrders,
            totalSpent: newTotalSpent,
            tag: newTag
          };
        });
        setCustomers(updatedCustomers);
        try {
          localStorage.setItem('sq_customers', JSON.stringify(updatedCustomers));
          localStorage.setItem('shaqueen_crm_customers_v1', JSON.stringify(updatedCustomers));
        } catch(e) {}

        // 3. Remove order from orders
        const updatedOrders = orders.filter(o => o.id !== ord.id);
        setOrders(updatedOrders);
        try {
          localStorage.setItem('sq_orders', JSON.stringify(updatedOrders));
          localStorage.setItem('shaqueen_crm_orders_v1', JSON.stringify(updatedOrders));
        } catch(e) {}

        // 4. Cascade Delete: Remove associated WhatsApp logs
        const updatedLogs = waLogs.filter(l => l.orderId !== ord.id);
        setWaLogs(updatedLogs);
        try {
          localStorage.setItem('sq_wa_logs', JSON.stringify(updatedLogs));
          localStorage.setItem('shaqueen_crm_wa_logs_v1', JSON.stringify(updatedLogs));
        } catch(e) {}

        // 5. Global Real-time Auto-Refresh Event
        if (typeof window !== 'undefined') {
          window.dispatchEvent(new CustomEvent('shaqueen-data-changed', { detail: { action: 'deleteOrder', id: ord.id } }));
        }

        showToast(`Transaksi retail ${ord.customerName} (${formatIDR(amountToRevert)}) berhasil dibatalkan. Tiket pipeline otomatis dihapus.`);
      };

                      let assignedCustId = '';

                      if (existingCustIndex !== -1) {

                          newTag = 'Loyal';

                          newTag = 'Baru';
                        }
                        updatedCustomers[existingCustIndex] = {
                          ...existingCust,
                          name: inputName || existingCust.name,
                          platform: inputPlatform || existingCust.platform,

                        customerActionNote = `Repeat Order pelanggan "${existingCust.name}" diupdate (+1 order, Total LTV: ${formatIDR(newTotalSpent)})`;

                      setCustomers(updatedCustomers);
                      try {

                        customerPhone: inputPhone,

                        productName: summaryProdName,

                        quantity: totalOrderQtyAll,
                        totalPcs: totalOrderPcsAll,

                      const deduction = deductionsMap[p.id] || 0;
                      if (!deduction) return p;
                      const newStock = Math.max(0, p.stock - deduction);

                        ...p,
                        stock: newStock,
                        status: newStock <= 0 ? 'habis' : 'aktif'

                    setProducts(updatedProducts);

                      if (ptIndex !== -1) {

                        const prevCartons = existingPt.totalPurchasedCartons !== undefined ? existingPt.totalPurchasedCartons : 0;

                        updatedPartners[ptIndex] = {
                          ...existingPt,
                          totalPurchasedCartons: prevCartons + totalOrderQtyAll,
                          totalSettledAmount: prevAmount + totalAmount,

                      } else {

                          id: matchedPartner.id,
                          storeName: inputName,
                          ownerName: inputName,

                          totalSettledAmount: totalAmount,

                        updatedPartners = [newPt, ...updatedPartners];

                      setPartners(updatedPartners);
                      try {
                        localStorage.setItem('sq_partners', JSON.stringify(updatedPartners));
                        localStorage.setItem('shaqueen_crm_partners_v1', JSON.stringify(updatedPartners));

          {/* ----------------- MODAL: TAMBAH PELANGGAN RETAIL ----------------- */}
          {modalCustomer && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                  <h3 className="font-black text-sm text-slate-900">Tambah Data Pelanggan Baru</h3>
                  <button onClick={() => setModalCustomer(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  const newC = {
                    id: 'c-' + Date.now(),
                    name: (fd.get('name') || '').trim(),
                    phone: (fd.get('phone') || '').trim(),
                    platform: fd.get('platform') || 'WhatsApp',
                    city: (fd.get('city') || '').trim() || 'Bandung',
                    totalOrders: 0,
                    totalSpent: 0,
                    lastOrder: new Date().toISOString().split('T')[0],
                    lastOrderDate: new Date().toISOString().split('T')[0],
                    tag: 'Baru'
                  };
                  const updated = [newC, ...customers];
                  setCustomers(updated);
                  try {
                    localStorage.setItem('sq_customers', JSON.stringify(updated));
                    localStorage.setItem('shaqueen_crm_customers_v1', JSON.stringify(updated));
                  } catch (e) {}
                  if (typeof window !== 'undefined') {
                    window.dispatchEvent(new CustomEvent('shaqueen-data-changed', {
                      detail: { action: 'addCustomer', id: newC.id }
                    }));
                  }
                  setModalCustomer(false);
                  showToast('Pelanggan baru berhasil didaftarkan!');
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Nama Lengkap</label>
                    <input name="name" required placeholder="Nama Pelanggan" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">No. WhatsApp</label>
                      <input name="phone" required placeholder="08..." className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl" />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Platform Asal</label>
                      <select name="platform" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl">
                        <option value="WhatsApp">WhatsApp</option>
                        <option value="Shopee">Shopee</option>
                        <option value="TikTok">TikTok</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Kota Asal</label>
                    <input name="city" placeholder="Bandung, Jakarta, dll" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl" />
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setModalCustomer(false)} className="px-4 py-2 bg-slate-100 rounded-xl font-bold text-slate-600">Batal</button>
                    <button type="submit" className="px-5 py-2 bg-brand-500 hover:bg-brand-600 text-white rounded-xl font-bold shadow-md shadow-brand-500/25 transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0">Simpan Pelanggan</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
